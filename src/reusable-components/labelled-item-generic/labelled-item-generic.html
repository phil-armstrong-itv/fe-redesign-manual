<dl>
  <dt>
    <span class="key">{{ item().display }}</span>
  </dt>
  <dd>
    @switch (type()) {
      @case('date') {
        <span>{{ (item().value | date) }}</span>
      }
      @case('boolean') {
        <ng-icon [name]="item().value ? 'lucideCheck' : 'lucideX'"></ng-icon>
      }
      @case('currency') {
        <span> {{ item().value.amount | currency: item().value.code }}</span>
      }
      @case('undefined') {
        <span>-</span>
      }
      @default {
        <span>{{ item().value.toString() || '-' }}</span>
      }
    }
  </dd>
</dl>
