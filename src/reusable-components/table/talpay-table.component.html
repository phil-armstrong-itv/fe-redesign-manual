<div hlmTableContainer>
  <table hlmTable>
    @if (caption()) {
      <caption hlmTableCaption>{{ caption() }}</caption>
    }
    <thead hlmTableHeader>
    <tr hlmTableRow>
      @for (column of columns(); track column.key) {
        <th hlmTableHead>{{ column.display }}</th>
      }
    </tr>
    </thead>
    <tbody hlmTableBody>
      @for (row of data(); track $index) {
        <tr hlmTableRow>
          @for (column of columns(); track column.key) {
            <td hlmTableCell>
              @if (cellTemplates()[column.key]; as template) {
                <ng-container *ngTemplateOutlet="template; context: { $implicit: row[column.key], row }" />
              } @else {
                {{ row[column.key] }}
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
