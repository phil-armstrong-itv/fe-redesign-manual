<div>
  <h2 class="mb-4 text-3xl font-bold tracking-tight text-heading md:text-2xl lg:text-4xl">Contributor relationships</h2>

  @if (relationships().length > 0)
  {
    <talpay-table [columns]="columns" [data]="relationships()"></talpay-table>
  } @else {
    <span>No relationships exist</span>
  }

  @if (partyType() === 'agent')
  {
    <div>
      <button hlmBtn>
        <ng-icon name="lucideArrowRightLeft" />
        <span>Record agent change</span>
      </button>
    </div>
  }
</div>
