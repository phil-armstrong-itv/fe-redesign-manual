@switch (partyType()) {
  @case ('contributor') {
    <app-agent-relationships [relationships]="relationships().agents" />
    <br />
    <app-service-company-relationships [relationships]="relationships().serviceCompanies" />
    <br />
    <app-deceased-relationships [relationships]="relationships().deceased" />
    <br />
  }
  @case ('agent') {
    <app-contributor-relationships [partyType]="partyType()!" [relationships]="relationships().contributors" />
    <br />
  }
  @case ('serviceCompany') {
    <app-contributor-relationships [partyType]="partyType()!" [relationships]="relationships().contributors" />
    <br />
    <app-deceased-relationships [relationships]="relationships().deceased" />
    <br />
  }
}
<app-relationship-notes [notes]="relationships().notes" />
