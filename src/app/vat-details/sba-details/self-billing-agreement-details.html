<span class="header">Self Billing Agreements</span>

<talpay-table [columns]="columns()" [data]="sbas()">
  <ng-template column="status" let-value>
    <ng-icon [name]="value === 'signed' ? 'lucideCheck' : 'lucideX'"></ng-icon>
    <span>{{ value | titlecase }}</span>
  </ng-template>
</talpay-table>
